<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Bhumika Prakashan</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="main.css">
</head>
<body id="page-contact">

    <!-- Navbar will be loaded here -->
    <div id="navbar-placeholder"></div>

    <header class="hero-section-contact" id="hero-contact">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 hero-text">
                    <h1 class="animate-on-load text-gradient">Get In Touch</h1>
                    <div class="hero-slider-container mt-3">
                        <button class="hero-slider-arrow" id="hero-slider-prev" aria-label="Previous Slide"><i class="bi bi-chevron-left"></i></button>
                        <div id="hero-slider-text-wrapper">
                             <p id="hero-slider-text" class="animate-on-load delay-1">We're here to help and answer any question you might have.</p>
                        </div>
                        <button class="hero-slider-arrow" id="hero-slider-next" aria-label="Next Slide"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row g-5">
            <div class="col-lg-6">
                <div class="contact-card h-100">
                    <h3 class="text-gradient mb-4">Contact Information</h3>
                    <div class="d-flex align-items:center my-4">
                        <i class="bi bi-telephone-fill text-primary fs-4"></i>
                        <a href="tel:+911234567890" class="text-decoration-none ms-3"><span class="footer-text fs-5">+91 12345 67890</span></a>
                    </div>
                    <div class="d-flex align-items:center my-4">
                        <i class="bi bi-envelope-fill text-primary fs-4"></i>
                        <a href="mailto:support@bhumika.com" class="text-decoration-none ms-3"><span class="footer-text fs-5">support@bhumika.com</span></a>
                    </div>
                    <div class="d-flex align-items:start my-4">
                        <i class="bi bi-geo-alt-fill text-primary fs-4"></i>
                        <div class="ms-3">
                            <span class="footer-text fs-5">Bhumika Prakashan Pvt. Ltd.</span>
                            <p class="text-muted">123 Learning Lane, New Delhi, India, 110001</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="contact-card h-100">
                    <h3 class="text-gradient mb-4">Send Us a Message</h3>
                    <form>
                        <div class="mb-3"><label for="name" class="form-label">Full Name</label><input type="text" class="form-control" id="name" placeholder="Enter your name"></div>
                        <div class="mb-3"><label for="email" class="form-label">Email Address</label><input type="email" class="form-control" id="email" placeholder="name@example.com"></div>
                        <div class="mb-3"><label for="subject" class="form-label">Subject</label><input type="text" class="form-control" id="subject" placeholder="Subject of your message"></div>
                        <div class="mb-3"><label for="message" class="form-label">Message</label><textarea class="form-control" id="message" rows="5" placeholder="Your message here..."></textarea></div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="main.js" defer></script>
</body>
</html>
