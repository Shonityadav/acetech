<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Bhumika Prakashan</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="main.css">
</head>

<body id="page-downloads">

    <!-- Navbar will be loaded here -->
    <div id="navbar-placeholder"></div>

    <header class="hero-section-contact" id="hero" style="background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2070&auto=format&fit=crop');">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 hero-text">
                    <h1 class="animate-on-load text-gradient">Download Center</h1>
                    <div class="hero-slider-container mt-3">
                        <button class="hero-slider-arrow" id="hero-slider-prev" aria-label="Previous Slide"><i class="bi bi-chevron-left"></i></button>
                        <div id="hero-slider-text-wrapper">
                             <p id="hero-slider-text" class="animate-on-load delay-1">Access teacher manuals, resources, and educational materials.</p>
                        </div>
                        <button class="hero-slider-arrow" id="hero-slider-next" aria-label="Next Slide"><i class="bi bi-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <section class="download-section py-5" id="downloads">
             <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">
                    <div class="mb-5 search-container">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search by title or subject...">
                    </div>
                    <div class="accordion" id="downloadsAccordion">
                        <!-- Content will be injected by JavaScript -->
                    </div>
                    <div id="no-results" style="display:none;">
                        <i class="bi bi-emoji-frown fs-1"></i>
                        <h4 class="mt-3">No Results Found</h4>
                        <p>Try adjusting your search terms.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="main.js" defer></script>
</body>

</html>
